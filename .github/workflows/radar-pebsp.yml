name: Radar PEBSP

on:
  schedule:
    - cron: "0 13 * * *" # 10h de Brasília
    - cron: "0 19 * * *" # 16h de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pesquisar e salvar pautas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const now = new Date();
          const brHour = Number(new Intl.DateTimeFormat("en-US", {
            timeZone: "America/Sao_Paulo",
            hour: "2-digit",
            hour12: false
          }).format(now));

          const periodo = brHour < 13 ? "manha" : "tarde";
          const recebidoEm = new Intl.DateTimeFormat("pt-BR", {
            timeZone: "America/Sao_Paulo"
          }).format(now);

          const dataId = recebidoEm.split("/").reverse().join("-");

          const prompt = `
          Você é o Radar Editorial do portal PEBSP, em português do Brasil.
          Faça uma busca atualizada na web por pautas educacionais brasileiras publicadas ou atualizadas recentemente.

          Procure oportunidades e notícias com alto potencial editorial:
          concursos, seleções, bolsas, graduação, pós-graduação, cursos gratuitos,
          formação de professores, vagas, MEC, Enem, Prouni, Sisu, universidades,
          institutos federais, educação básica, IA na educação e políticas públicas.

          Priorize fontes oficiais e primárias. Não invente informações.
          Se houver prazo, informe-o. Use a URL oficial completa.
          Escolha no máximo 12 pautas realmente úteis e novas.

          Devolva SOMENTE JSON válido, sem markdown, neste formato:
          {
            "pautas": [
              {
                "title": "Título jornalístico sugerido",
                "institution": "Instituição",
                "category": "Categoria",
                "deadline": "Prazo ou Sem prazo",
                "priority": "urgent",
                "score": 9.5,
                "vagas": "Ex.: 200 vagas",
                "summary": "Resumo objetivo da oportunidade",
                "reason": "Por que esta pauta é relevante",
                "url": "https://..."
              }
            ]
          }

          priority deve ser somente: urgent, high, medium ou evergreen.
          `;

          const response = await fetch("https://api.openai.com/v1/responses", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`
            },
            body: JSON.stringify({
              model: "gpt-5.6-luna",
              tools: [{ type: "web_search" }],
              input: prompt
            })
          });

          if (!response.ok) {
            throw new Error(`Erro da OpenAI: ${response.status} ${await response.text()}`);
          }

          const result = await response.json();
          let text = result.output_text ||
            result.output?.flatMap(item => item.content || [])
              .filter(item => item.type === "output_text")
              .map(item => item.text)
              .join("") || "";

          text = text.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/\s*```$/i, "");
          const parsed = JSON.parse(text);

          const prioridades = new Set(["urgent", "high", "medium", "evergreen"]);

          const pautas = (parsed.pautas || []).slice(0, 12).map((pauta, index) => ({
            id: `radar-${dataId}-${periodo}-${String(index + 1).padStart(2, "0")}`,
            title: String(pauta.title || "Pauta sem título"),
            institution: String(pauta.institution || "Fonte oficial"),
            category: String(pauta.category || "Educação"),
            deadline: String(pauta.deadline || "Sem prazo informado"),
            priority: prioridades.has(pauta.priority) ? pauta.priority : "high",
            score: Math.max(0, Math.min(10, Number(pauta.score) || 8)),
            status: "Nova",
            vagas: String(pauta.vagas || "—"),
            summary: String(pauta.summary || ""),
            reason: String(pauta.reason || ""),
            url: String(pauta.url || ""),
            receivedAt: recebidoEm,
            radarPeriod: periodo
          }));

          fs.mkdirSync("data", { recursive: true });
          fs.writeFileSync("data/radar.json", JSON.stringify({
            updatedAt: now.toISOString(),
            radarPeriod: periodo,
            pautas
          }, null, 2));
          NODE

      - name: Salvar radar no repositório
        run: |
          git config user.name "Radar PEBSP"
          git config user.email "radar@pebsp.com.br"
          git add data/radar.json
          git diff --staged --quiet || git commit -m "Atualiza radar PEBSP"
          git push
